block.jababarium-tochka-u.name = Artillery
block.jababarium-tochka-u.description = A commandable artillery launcher. After charging with power it consumes surge alloy to strike a chosen location with a devastating blast and arcs of lightning. Several launchers can be commanded together.
block.jababarium-feronium-factory.name = Feronium Factory
block.jababarium-feronium-factory.description = Smelts silicon and thorium into feronium using power.
block.jababarium-nectrone-dissociator.name = Nectrone Dissociator
block.jababarium-nectrone-dissociator.description = Breaks down thorium, adamantium and sergium with power into nectron liquid.
block.jababarium-cryostal-compressor.name = Cryosteel Compressor
block.jababarium-cryostal-compressor.description = Compresses titanium, metaglass and feronium with the help of cryofluid and power into cryosteel.
block.jababarium-sergium-factory.name = Sergium Factory
block.jababarium-sergium-factory.description = Combines chronite, adamantium and blast compound with aerial liquid and power to produce sergium.
block.jababarium-amalgam-presser.name = Amalgam Presser
block.jababarium-amalgam-presser.description = Presses cryosteel and surge alloy together with mercury and power into amalgam.
block.jababarium-singularium-loom.name = Singularium Loom
block.jababarium-singularium-loom.description = Weaves amalgam and sergium with argon and power into singularium.
block.jababarium-chronite-foundry.name = Chronite Foundry
block.jababarium-chronite-foundry.description = Casts feronium, surge alloy and lead into chronite using power.
block.jababarium-pulsarite-refactor.name = Pulsarite Refactor
block.jababarium-pulsarite-refactor.description = Refines chronite, feronium and plastanium with nectron liquid and power into pulsarite.
block.jababarium-aerial-converter.name = Aerial Converter
block.jababarium-aerial-converter.description = Converts water with cryosteel, metaglass and power into aerial liquid.
block.jababarium-flux-reactor.name = Flux Reactor
block.jababarium-flux-reactor.description = A colossal reactor that burns sergium, pulsarite and adamantium to generate enormous amounts of power. It must be fed argon coolant, or it will overheat, melt down and explode.
block.jababarium-cryostal-conveyor.name = Cryosteel Conveyor
block.jababarium-cryostal-conveyor.description = A fast conveyor forged from cryosteel and adamantium. It moves items noticeably quicker than ordinary belts and can be overdriven.
block.jababarium-cryostal-item-bridge.name = Cryosteel Item Bridge
block.jababarium-cryostal-item-bridge.description = A cryosteel bridge that hurls items across short gaps with very little delay. Holds a generous buffer and can be overdriven.
block.jababarium-cryostal-junction.name = Cryosteel Junction
block.jababarium-cryostal-junction.description = Lets two item streams cross without mixing. Its large buffer keeps fast cryosteel lines flowing.
block.jababarium-cryostal-router.name = Cryosteel Router
block.jababarium-cryostal-router.description = Instantly hands items over to adjacent blocks, spreading them evenly. Has a large buffer for high-speed lines.
block.jababarium-argon-melter.name = Argon Melter
block.jababarium-argon-melter.description = Merges nectron, mercury and aerial liquid with power into argon.
block.jababarium-mercury-splitter.name = Mercury Splitter
block.jababarium-mercury-splitter.description = Extracts liquid mercury from chronite and tungsten using aerial liquid and power.
block.jababarium-anti-matter-warper.name = Anti-Matter Warper
block.jababarium-anti-matter-warper.description = A warping gate that sends selected friendly units to a chosen location. Enemy gravity trap fields can intercept the warp.
block.jababarium-sky-forge.name = Sky Constructor
block.jababarium-sky-forge.description = A factory that builds light air units, Scouts and Zanukas, from silicon, lead, graphite and metaglass.
block.jababarium-adamantium-synthesizer.name = Adamantium Synthesizer
block.jababarium-adamantium-synthesizer.description = A power generator that consumes adamantium together with cryofluid to produce a steady supply of energy.
block.jababarium-self-healing-conduit.name = Self-Healing Conduit
block.jababarium-self-healing-conduit.description = A conduit that repairs itself while liquid flows through it. Hot liquids slow the repairs.
block.jababarium-self-healing-junction.name = Self-Healing Junction
block.jababarium-self-healing-junction.description = A liquid junction that mends its own damage while liquid passes through. Hot liquids slow the repairs.
block.jababarium-self-healing-router.name = Self-Healing Router
block.jababarium-self-healing-router.description = A liquid router that repairs itself while it holds liquid. Hot liquids slow the repairs.
block.jababarium-self-healing-liquid-bridge.name = Self-Healing Liquid Bridge
block.jababarium-self-healing-liquid-bridge.description = A liquid bridge that repairs itself while liquid flows through it. Hot liquids slow the repairs.
block.jababarium-helix.name = Helix
block.jababarium-helix.description = A long-range turret that charges up and launches plastanium as a huge burst shell, which shatters into lightning-charged fragments. Needs power and cryofluid coolant.
block.jababarium-singularity-needle.name = Singularity Needle
block.jababarium-singularity-needle.description = A long-range turret that shoots phase fabric as an instant needle of compressed singularity, detonating with a vast blast at the target. Needs power and cryofluid.
block.jababarium-entropy-chain.name = Entropy Chain
block.jababarium-entropy-chain.description = A power-driven turret that fires fast bolts of plastanium-fed energy which release lightning on impact.
block.jababarium-ionizer.name = Ionizer
block.jababarium-ionizer.description = A colossal power turret that fires extremely fast homing slugs. Hit enemies become ionized, which slows them and wears them down.
block.jababarium-ignis.name = Ignis
block.jababarium-ignis.description = A turret that alternately fires graphite rounds. Hits leave targets corroded.
block.jababarium-hastae.name = Hastae
block.jababarium-hastae.description = A turret with an astonishing range that launches surge alloy as an almost instant lance. It pierces everything in its path and calls down lightning along the way.
block.jababarium-overlord.name = Overlord
block.jababarium-overlord.description = A power turret that slowly charges and then looses a massive piercing shell with a gigantic explosion, shooting lightning to both sides along its flight. Needs coolant.
block.jababarium-transgression.name = Transgression
block.jababarium-transgression.description = A power turret that projects a continuous beam of flame, which pierces armor and sets targets ablaze. Needs a steady water supply.
block.jababarium-chronos.name = Chronos
block.jababarium-chronos.description = A very long-range turret that lobs chronite shells. Each shell creates a field that freezes every unit inside it in time for a while.
block.jababarium-apex.name = Apex
block.jababarium-apex.description = An enormous artillery turret with immense range. It fires plastanium shells that explode with a huge blast and scatter a hundred shards. Needs power.
block.jababarium-solar-apex.name = Solar Apex
block.jababarium-solar-apex.description = A power turret that channels a continuous beam of solar fire which pierces armor and melts targets. Needs vast power and a heavy supply of cryofluid.
block.jababarium-entropy.name = Entropy
block.jababarium-entropy.description = A giant rapid-fire turret that rains heavy thorium rounds from rotating barrels. The rounds pierce targets and slow them. Needs power and coolant.
block.jababarium-abbys.name = Abyss
block.jababarium-abbys.description = A monumental artillery turret that fires a singularium shell of terrifying power, ripping the battlefield with lightning and lingering flames. Needs power and argon coolant.
block.jababarium-kolomuiskiy-reconstructor.name = Kolomuiskiy Reconstructor
block.jababarium-kolomuiskiy-reconstructor.description = Performs the first upgrade step, refitting basic air, naval and legged units into their next form.
block.jababarium-rapsodium-reconstructor.name = Rapsodium Reconstructor
block.jababarium-rapsodium-reconstructor.description = Performs the second upgrade step, refitting units into an even stronger form. Needs a lot of power and resources.
block.jababarium-spectral-reconstructor.name = Spectral Reconstructor
block.jababarium-spectral-reconstructor.description = Performs the third upgrade step, turning advanced units into heavy combat machines.
block.jababarium-omega-reconstructor.name = Omega Reconstructor
block.jababarium-omega-reconstructor.description = Performs the fourth upgrade step, raising heavy units to a formidable form. Also needs a supply of aerial liquid.
block.jababarium-nyx.name = Nyx
block.jababarium-nyx.description = A turret with an extreme rate of fire that hammers enemies with titanium rounds and corrodes them. It draws extra power while active.
block.jababarium-avangard.name = Avangard
block.jababarium-avangard.description = A turret that alternately fires homing spore pod rounds. The shots leave targets corroded.
block.jababarium-omega.name = Omega
block.jababarium-omega.description = A rapid-fire turret that spits heavy silicon slugs from alternating barrels.
block.jababarium-beta-reconstructor.name = Beta Reconstructor
block.jababarium-beta-reconstructor.description = Performs the fifth upgrade step, creating the strongest units a reconstructor can make. Needs a supply of nectron liquid.
block.jababarium-reaper.name = Reaper
block.jababarium-reaper.description = A heavy launcher that fires homing missiles loaded with blast compound, thorium or pyratite. It strikes both ground and air targets, and the missiles cause blasts or burning depending on the ammo.
block.jababarium-nexus.name = Nexus
block.jababarium-nexus.description = A power turret that launches a plasma bolt which detonates on impact, after which lightning keeps lashing at enemies near the blast. Hits both ground and air.
block.jababarium-cascade.name = Cascade
block.jababarium-cascade.description = A huge turret that sweeps titanium-fed continuous laser beams across the battlefield, piercing everything in their path and freezing targets. Needs power and cryofluid.
block.jababarium-tempest.name = Tempest
block.jababarium-tempest.description = A power turret that fires a charged bolt which bursts into a storm of purple lightning radiating in all directions on impact. Hits ground and air.
block.jababarium-basic-unit-printer.name = Basic Unit Printer
block.jababarium-basic-unit-printer.description = Prints a hologram-based upgrade for a heavy unit, turning it into its next, stronger form. Needs huge amounts of resources and power.
block.jababarium-advanced-unit-printer.name = Advanced Unit Printer
block.jababarium-advanced-unit-printer.description = Prints an upgrade for the very strongest units, raising them to their ultimate form. Needs enormous amounts of resources and power.
block.jababarium-ground-forge.name = Ground Forge
block.jababarium-ground-forge.description = A factory that builds small legged Tiny units from silicon and copper.
block.jababarium-tide-forge.name = Tide Forge
block.jababarium-tide-forge.description = A factory that builds light naval units, Undertows and Pelagises, from feronium, copper and lead.
block.jababarium-surge-refactor.name = Surge Refactor
block.jababarium-surge-refactor.description = Refines copper, feronium and titanium into surge alloy using power.
block.jababarium-cryostal-drill.name = Cryosteel Drill
block.jababarium-cryostal-drill.description = A massive power-hungry drill able to bore through even the hardest ores, including adamantium.
block.jababarium-cryostal-unloader.name = Cryosteel Unloader
block.jababarium-cryostal-unloader.description = Pulls items out of adjacent containers and storage at great speed and passes them on. Expensive, but far faster than a standard unloader.
block.jababarium-nokko.name = Nokko
block.jababarium-nokko.description = A gigantic turret that fires spore pod shells, causing a vast corrosive blast and releasing many homing, piercing corrosive fragments. Needs power and water, and hits ground and air.
block.jababarium-gammaReaper.name = Gamma Reaper
block.jababarium-gammaReaper.description = The ultimate siege turret. It launches a colossal singularium missile that deals devastating damage across a huge radius. Needs immense power and argon coolant.
block.jababarium-ore-adamantium.name = Adamantium Ore
block.jababarium-ore-adamantium.description = A hard ore rich in adamantium. Units cannot mine it, so a powerful drill is required.

item.jababarium-feronium.name = Feronium
item.jababarium-feronium.description = A dense reddish alloy and the backbone of most buildings and upgrades in this mod. It is highly explosive.
item.jababarium-cryostal.name = Cryosteel
item.jababarium-cryostal.description = A cold, glowing crystal steel with faint radioactivity. Used in fast logistics and many advanced structures.
item.jababarium-pulsarite.name = Pulsarite
item.jababarium-pulsarite.description = An unstable, highly charged, radioactive and explosive crystal. Fuels reactors and goes into advanced structures and units.
item.jababarium-singularium.name = Singularium
item.jababarium-singularium.description = A heavy, charged and very explosive substance of compressed singularity. Used as ammo for the mightiest turrets and to build the most advanced structures.
item.jababarium-chronite.name = Chronite
item.jababarium-chronite.description = A heavy grey metal that bends time. Used as ammo for Chronos and as an ingredient for advanced materials and structures.
item.jababarium-sergium.name = Sergium
item.jababarium-sergium.description = A dark blue, extremely radioactive and explosive metal. Burned in reactors and used to make the most advanced materials.
item.jababarium-amalgam.name = Amalgam
item.jababarium-amalgam.description = A golden alloy pressed from rare metals. A key ingredient for singularium and for the biggest turrets and printers.
item.jababarium-adamantium.name = Adamantium
item.jababarium-adamantium.description = An extremely hard metal that can only be mined with powerful drills. Used in fast logistics, power generation and many structures.

liquid.jababarium-nectron.name = Nectrone
liquid.jababarium-nectron.description = A thick, flammable and explosive green liquid. It is not a coolant, but is used in advanced crafting and upgrades.
liquid.jababarium-aerial.name = Aerial
liquid.jababarium-aerial.description = A light, free-flowing liquid made from water. A key ingredient for advanced crafting and upgrades.
liquid.jababarium-mercury.name = Mercury
liquid.jababarium-mercury.description = A heavy silvery liquid metal that is slightly flammable. Used to press amalgam.
liquid.jababarium-argon.name = Argon
liquid.jababarium-argon.description = A glowing purple liquid that works as a coolant. Cools giant reactors and turrets, and is used to make singularium.

status.jababarium-ionized-status.name = Ionized
status.jababarium-ionized-status.description = Ionized units are slowed, fire more slowly and take continuous damage with arcs of lightning.
status.jababarium-chronos-stop.name = Chrono Stasis
status.jababarium-chronos-stop.description = Frozen in time. The unit cannot move, shoot or build until the effect fades.
status.jababarium-intercepted.name = Intercepted
status.jababarium-intercepted.description = Knocked out of a warp. The unit is slowed, weakened and has reduced durability.

unit.jababarium-scout.name = Scout
unit.jababarium-scout.description = A swift, lightly armed air unit for harassment and reconnaissance. Built at the Sky Forge.
unit.jababarium-fray.name = Fray
unit.jababarium-fray.description = An air gunship that fires fast laser bolts from its wings.
unit.jababarium-zanuka.name = Zanuka
unit.jababarium-zanuka.description = A nimble light air unit that peppers enemies with rapid shots. Built at the Sky Forge.
unit.jababarium-blip.name = Blip
unit.jababarium-blip.description = A fast air unit that lashes enemies at close range with arcing lightning.
unit.jababarium-geran.name = Geran
unit.jababarium-geran.description = A fast kamikaze drone. It dives onto its target and explodes, damaging everything around.
unit.jababarium-omniq.name = Omniq
unit.jababarium-omniq.description = A durable air support unit with a protective shield and a repair field that heals nearby allies.
unit.jababarium-vortex.name = Vortex
unit.jababarium-vortex.description = A heavily armored air interceptor that closes in on enemies and fires bursts of energy orbs.
unit.jababarium-spectre.name = Spectre
unit.jababarium-spectre.description = A heavy air unit armed with twin laser beam cannons.
unit.jababarium-destroyer.name = Destroyer
unit.jababarium-destroyer.description = A heavily armored air warship with a plasma cannon, a continuous plasma beam and a supporting burst cannon.
unit.jababarium-inferno.name = Inferno
unit.jababarium-inferno.description = A heavy air unit that fires crimson shells and a trio of heavy crimson lances, backed by a laser support cannon.
unit.jababarium-decimator.name = Decimator
unit.jababarium-decimator.description = A huge air warship that fires void plasma, guided void missiles and collapsing void blasts.
unit.jababarium-vindicator.name = Vindicator
unit.jababarium-vindicator.description = A huge air warship with crimson chain shots, a continuous crimson beam, burst lasers and crimson nova blasts.
unit.jababarium-revenant.name = Revenant
unit.jababarium-revenant.description = A gigantic air flagship armed with frost-themed weapons: absolute zero blasts, guided missiles, streams and cascades of ice, and a frost shotgun.
unit.jababarium-oblivion.name = Oblivion
unit.jababarium-oblivion.description = A gigantic air flagship that unleashes crimson vortexes, inferno cores, guided lances and burst lasers.
unit.jababarium-nemesis.name = Nemesis
unit.jababarium-nemesis.description = The ultimate air flagship. It brings down enemies with a nature-themed arsenal of verdant beams, lightning webs, collapsing blasts and a spinning cross laser, and its shockwaves push enemies back.
unit.jababarium-tiny.name = Tiny
unit.jababarium-tiny.description = A small legged unit that lobs shells at enemies. Built at the Ground Forge.
unit.jababarium-ariel.name = Ariel
unit.jababarium-ariel.description = A light legged unit with a compact cannon, tougher than its predecessor.
unit.jababarium-widow.name = Widow
unit.jababarium-widow.description = A sturdy legged unit armed with an assault cannon, a minigun, missile bursts and a lightning emitter.
unit.jababarium-empress.name = Empress
unit.jababarium-empress.description = A massive legged unit that fires burning lasers, pulse waves and thunder shots.
unit.jababarium-theridion.name = Theridion
unit.jababarium-theridion.description = A massive legged unit that hurls heavy bolts and arcing energy at its enemies.
unit.jababarium-octoclasm.name = Octoclasm
unit.jababarium-octoclasm.description = A huge legged war machine firing bursts of heavy bolts and charged cannon blasts.
unit.jababarium-oraxia.name = Oraxia
unit.jababarium-oraxia.description = A colossal legged war machine with a death beam, ancient energy balls and a battery of heavy guns.
unit.jababarium-broodmother.name = Broodmother
unit.jababarium-broodmother.description = The mightiest legged unit, with a ruinous death beam, tide energy balls, a repeating laser and supernova artillery.
unit.jababarium-undertow.name = Undertow
unit.jababarium-undertow.description = A light naval unit with a rapid-fire gun. Built at the Tide Forge.
unit.jababarium-pelagis.name = Pelagis
unit.jababarium-pelagis.description = A light naval unit armed with a deck cannon. Built at the Tide Forge.
unit.jababarium-ripjaw.name = Ripjaw
unit.jababarium-ripjaw.description = A naval unit that launches missiles at enemies.
unit.jababarium-aquarail.name = Aquarail
unit.jababarium-aquarail.description = A naval unit that launches missiles at enemies from a sturdier hull.
unit.jababarium-brinneclaw.name = Brinneclaw
unit.jababarium-brinneclaw.description = A heavy naval unit that combines missile barrages with arcing lightning.
unit.jababarium-vector.name = Vector
unit.jababarium-vector.description = A heavy naval unit that combines missile barrages with arcing lightning.
unit.jababarium-maelstromis.name = Maelstromis
unit.jababarium-maelstromis.description = A big naval warship that fires bursts of energy orbs backed by a support cannon.
unit.jababarium-glacial.name = Glacial
unit.jababarium-glacial.description = A big naval warship armed with burst lasers and a heavy crimson lance.
unit.jababarium-quantar.name = Quantar
unit.jababarium-quantar.description = A heavily armored naval warship that fires quantum bolts and ion pulses.
unit.jababarium-rift.name = Rift
unit.jababarium-rift.description = A naval warship that tears at enemies with rift blasts and red lightning.
unit.jababarium-leviathan.name = Leviathan
unit.jababarium-leviathan.description = A monstrous naval warship with bursts of quantum bolts, plasma bolts and a hyper beam.
unit.jababarium-phantom.name = Phantom
unit.jababarium-phantom.description = A naval warship that strikes with rift blasts and volleys of red lightning.
unit.jababarium-tidebreaker.name = Tidebreaker
unit.jababarium-tidebreaker.description = A mighty naval flagship armed with void lances, missile strikes, twin laser cannons, condensed bolts and lightning.
unit.jababarium-ocelexis.name = Ocelexis
unit.jababarium-ocelexis.description = The ultimate naval flagship. It unleashes red lightning, tide lasers and energy balls, lightning bursts and collapsing shells.

