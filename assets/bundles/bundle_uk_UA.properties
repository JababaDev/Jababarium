block.jababarium-tochka-u.name = Точка-У
block.jababarium-tochka-u.description = Командна артилерійська установка. Зарядившись енергією, витрачає кінетичний сплав, щоб вразити обране місце нищівним вибухом і розрядами блискавок. Кількома установками можна керувати разом.
block.jababarium-feronium-factory.name = Фероновий тигель
block.jababarium-feronium-factory.description = Виплавляє фероній із кремнію та торію за допомогою енергії.
block.jababarium-nectrone-dissociator.name = Нектроновий Діссоціатор
block.jababarium-nectrone-dissociator.description = Розщеплює торій, адамантій і серджіум за допомогою енергії на рідкий нектрон.
block.jababarium-cryostal-compressor.name = Кріосталевий Компрессор
block.jababarium-cryostal-compressor.description = Стискає титан, метаскло та фероній за допомогою кріорідини та енергії у кріосталь.
block.jababarium-sergium-factory.name = Змішувач Серджіуму
block.jababarium-sergium-factory.description = Поєднує хроніт, адамантій та вибухову суміш з ефіром та енергією, виробляючи серджіум.
block.jababarium-amalgam-presser.name = Прес Амальгаму
block.jababarium-amalgam-presser.description = Пресує кріосталь і кінетичний сплав разом із ртуттю та енергією в амальгам.
block.jababarium-singularium-loom.name = Ткач Сингулярності
block.jababarium-singularium-loom.description = Переплітає амальгам і серджіум з аргоном та енергією в сингуляріум.
block.jababarium-chronite-foundry.name = Ливар Хроніту
block.jababarium-chronite-foundry.description = Відливає хроніт із фероніуму, кінетичного сплаву та свинцю за допомогою енергії.
block.jababarium-pulsarite-refactor.name = Пульсаріумовий Рефактор
block.jababarium-pulsarite-refactor.description = Переробляє хроніт, фероній і пластаній з рідким нектроном та енергією на пульсарит.
block.jababarium-aerial-converter.name = Перетворювач Ефіру
block.jababarium-aerial-converter.description = Перетворює воду разом із кріосталлю, метаскло та енергією на рідкий ефір.
block.jababarium-flux-reactor.name = Флюксовий Реактор
block.jababarium-flux-reactor.description = Колосальний реактор, що спалює серджіум, пульсарит та адамантій для вироблення величезної кількості енергії. Потребує аргонового охолодження, інакше перегрівається, плавиться та вибухає.
block.jababarium-cryostal-conveyor.name = Кріосталевий Конвеєр
block.jababarium-cryostal-conveyor.description = Швидкий конвеєр, викуваний з кріосталі та адамантію. Переміщує предмети помітно швидше за звичайні стрічки й може бути розігнаний.
block.jababarium-cryostal-item-bridge.name = Кріосталевий Міст
block.jababarium-cryostal-item-bridge.description = Кріостальовий міст, що майже миттєво перекидає предмети через невеликі проміжки. Має місткий буфер і може бути розігнаний.
block.jababarium-cryostal-junction.name = Кріосталеве Перехрестя
block.jababarium-cryostal-junction.description = Дозволяє двом потокам предметів перетинатися без змішування. Великий буфер підтримує рух на швидких кріостальових лініях.
block.jababarium-cryostal-router.name = Кріосталевий Маршрутизатор
block.jababarium-cryostal-router.description = Миттєво передає предмети сусіднім блокам, рівномірно їх розподіляючи. Має великий буфер для швидких ліній.
block.jababarium-argon-melter.name = Змішувач Аргону
block.jababarium-argon-melter.description = Поєднує нектрон, ртуть та ефір за допомогою енергії в аргон.
block.jababarium-mercury-splitter.name = Розщіплювач Ртуті
block.jababarium-mercury-splitter.description = Виділяє рідку ртуть із хроніту та вольфраму за допомогою ефіру та енергії.
block.jababarium-anti-matter-warper.name = Деформатор Антиматерії
block.jababarium-anti-matter-warper.description = Деформаційна брама, що переміщує обраних дружніх юнітів у вказане місце. Гравітаційні пастки ворога можуть перехопити переміщення.
block.jababarium-sky-forge.name = Повітряний Конструктор
block.jababarium-sky-forge.description = Фабрика, що будує легких повітряних юнітів, Скаутів і Занук, із кремнію, свинцю, графіту та метаскла.
block.jababarium-adamantium-synthesizer.name = Адамантієвий Синтезатор
block.jababarium-adamantium-synthesizer.description = Генератор енергії, що споживає адамантій разом із кріорідиною для стабільного вироблення енергії.
block.jababarium-self-healing-conduit.name = Самовідновлювальний Трубопровід
block.jababarium-self-healing-conduit.description = Трубопровід, що відновлює себе, поки по ньому тече рідина. Гарячі рідини уповільнюють відновлення.
block.jababarium-self-healing-junction.name = Самовідновлювальне Перехрестя
block.jababarium-self-healing-junction.description = Рідинне перехрестя, що лагодить власні пошкодження, поки через нього проходить рідина. Гарячі рідини уповільнюють відновлення.
block.jababarium-self-healing-router.name = Самовідновлювальний Маршрутизатор
block.jababarium-self-healing-router.description = Рідинний маршрутизатор, що відновлює себе, поки містить рідину. Гарячі рідини уповільнюють відновлення.
block.jababarium-self-healing-liquid-bridge.name = Самовідновлювальний Мостовий Трубопровід
block.jababarium-self-healing-liquid-bridge.description = Рідинний міст, що відновлює себе, поки по ньому тече рідина. Гарячі рідини уповільнюють відновлення.
block.jababarium-helix.name = Хелікс
block.jababarium-helix.description = Далекобійна турель, що заряджається та випускає пластаній величезним розривним снарядом, який розпадається на уламки з блискавками. Потребує енергії та кріорідини для охолодження.
block.jababarium-singularity-needle.name = Голка Сінгулярності
block.jababarium-singularity-needle.description = Далекобійна турель, що вистрілює фазову тканину миттєвою голкою стисненої сингулярності, яка вибухає на цілі величезним спалахом. Потребує енергії та кріорідини.
block.jababarium-entropy-chain.name = Ланцюг Ентропії
block.jababarium-entropy-chain.description = Турель на енергії, що стріляє швидкими енергетичними згустками на пластанії, які при влученні вивільняють блискавки.
block.jababarium-ionizer.name = Іонайзер
block.jababarium-ionizer.description = Колосальна енергетична турель, що стріляє надшвидкими самонавідними снарядами. Вражені вороги іонізуються, що уповільнює їх та виснажує.
block.jababarium-ignis.name = Ігніс
block.jababarium-ignis.description = Турель, що почергово стріляє графітовими снарядами. Влучання роз'їдає цілі.
block.jababarium-hastae.name = Спис
block.jababarium-hastae.description = Турель із вражаючою дальністю, що запускає кінетичний сплав майже миттєвим списом. Він пронизує все на шляху та викликає блискавки по дорозі.
block.jababarium-overlord.name = Оверлорд
block.jababarium-overlord.description = Енергетична турель, що повільно заряджається, а потім випускає масивний снаряд, який пронизує цілі та спричиняє гігантський вибух, випускаючи блискавки з боків під час польоту. Потребує охолодження.
block.jababarium-transgression.name = Порушення
block.jababarium-transgression.description = Енергетична турель, що випускає безперервний промінь полум'я, який пробиває броню та підпалює цілі. Потребує постійного подання води.
block.jababarium-chronos.name = Хронос
block.jababarium-chronos.description = Надзвичайно далекобійна турель, що закидає снарядами з хроніту. Кожен снаряд створює поле, яке на деякий час завмороджує в часі всі юніти всередині.
block.jababarium-apex.name = Апекс
block.jababarium-apex.description = Величезна артилерійська турель із неймовірною дальністю. Стріляє пластанієвими снарядами, що вибухають потужним спалахом і розсипають безліч уламків. Потребує енергії.
block.jababarium-solar-apex.name = Сонцекрай
block.jababarium-solar-apex.description = Енергетична турель, що спрямовує безперервний промінь сонячного вогню, який пробиває броню та плавить цілі. Потребує великої кількості енергії та кріорідини.
block.jababarium-entropy.name = Ентропія
block.jababarium-entropy.description = Гігантська скорострільна турель, що засипає ворогів важкими торієвими снарядами з обертових стволів. Снаряди пронизують цілі та уповільнюють їх. Потребує енергії та охолодження.
block.jababarium-abbys.name = Пустота
block.jababarium-abbys.description = Монументальна артилерійська турель, що випускає снаряд із сингуляріуму жахливої сили, роздираючи поле бою блискавками й вогнем, що довго горить. Потребує енергії та аргонового охолодження.
block.jababarium-kolomuiskiy-reconstructor.name = Коломийський Реконструктор
block.jababarium-kolomuiskiy-reconstructor.description = Виконує перший крок вдосконалення, переобладнуючи базових повітряних, морських та ходячих юнітів у наступну форму.
block.jababarium-rapsodium-reconstructor.name = Рапсодіумовий Реконструктор
block.jababarium-rapsodium-reconstructor.description = Виконує другий крок вдосконалення, переобладнуючи юнітів у ще сильнішу форму. Потребує багато енергії та ресурсів.
block.jababarium-spectral-reconstructor.name = Спектральний Реконструктор
block.jababarium-spectral-reconstructor.description = Виконує третій крок вдосконалення, перетворюючи просунутих юнітів на важкі бойові машини.
block.jababarium-omega-reconstructor.name = Омега Реконструктор
block.jababarium-omega-reconstructor.description = Виконує четвертий крок вдосконалення, піднімаючи важких юнітів до грізної форми. Також потребує подання ефіру.
block.jababarium-nyx.name = Нікс
block.jababarium-nyx.description = Турель із надзвичайною скорострільністю, що обсипає ворогів титановими снарядами та роз'їдає їх. Під час роботи споживає додаткову енергію.
block.jababarium-avangard.name = Авангард
block.jababarium-avangard.description = Турель, що почергово стріляє самонавідними снарядами зі спорових стручків. Влучання роз'їдає цілі.
block.jababarium-omega.name = Омега
block.jababarium-omega.description = Скорострільна турель, що почергово викидає важкі кремнієві снаряди з різних стволів.
block.jababarium-beta-reconstructor.name = Бета Реконструктор
block.jababarium-beta-reconstructor.description = Виконує п'ятий крок вдосконалення, створюючи найсильніших юнітів, яких здатен створити реконструктор. Потребує подання нектрону.
block.jababarium-reaper.name = Жнець
block.jababarium-reaper.description = Важка ракетна установка, що випускає самонавідні ракети з вибуховою сумішшю, торієм або піратитом. Вражає наземні та повітряні цілі, а ракети спричиняють вибухи або горіння залежно від боєприпасу.
block.jababarium-nexus.name = Нексус
block.jababarium-nexus.description = Енергетична турель, що запускає плазмовий згусток, який вибухає при влученні, після чого блискавки продовжують бити по ворогах поблизу. Вражає наземні та повітряні цілі.
block.jababarium-cascade.name = Каскад
block.jababarium-cascade.description = Величезна турель, що розгортає по полю бою безперервні лазерні промені на титані, пронизуючи все на шляху та заморожуючи цілі. Потребує енергії та кріорідини.
block.jababarium-tempest.name = Темпест
block.jababarium-tempest.description = Енергетична турель, що стріляє зарядженим згустком, який при влученні вибухає штормом фіолетових блискавок на всі боки. Вражає наземні та повітряні цілі.
block.jababarium-basic-unit-printer.name = Базовий Модуль Друку
block.jababarium-basic-unit-printer.description = Друкує голографічне вдосконалення важкого бойового юніта, перетворюючи його на наступну, сильнішу форму. Потребує величезної кількості ресурсів та енергії.
block.jababarium-advanced-unit-printer.name = Просунутий Модуль Друку
block.jababarium-advanced-unit-printer.description = Друкує вдосконалення для наймогутніших юнітів, піднімаючи їх до остаточної форми. Потребує колосальної кількості ресурсів та енергії.
block.jababarium-ground-forge.name = Наземний Конструктор
block.jababarium-ground-forge.description = Фабрика, що будує невеликих ходячих Малюків із кремнію та міді.
block.jababarium-tide-forge.name = Водний Конструктор
block.jababarium-tide-forge.description = Фабрика, що будує легких морських юнітів, Андертоу та Пелагісів, із фероніуму, міді та свинцю.
block.jababarium-surge-refactor.name = Кінетичний Рефактор
block.jababarium-surge-refactor.description = Переробляє мідь, фероній і титан на кінетичний сплав за допомогою енергії.
block.jababarium-cryostal-drill.name = Кріостальовий Бур
block.jababarium-cryostal-drill.description = Масивний енергоємний бур, здатний пробурити навіть найтвердіші руди, зокрема адамантій.
block.jababarium-cryostal-unloader.name = Кріостальовий Розвантажувач
block.jababarium-cryostal-unloader.description = Із високою швидкістю витягує предмети зі сусідніх контейнерів і сховищ та передає їх далі. Дорогий, але значно швидший за звичайний розвантажувач.
block.jababarium-nokko.name = Нокко
block.jababarium-nokko.description = Гігантська турель, що стріляє снарядами зі спорових стручків, спричиняючи величезний роз'їдаючий вибух і випускаючи безліч самонавідних уламків, що пронизують цілі. Потребує енергії та води, вражає наземні та повітряні цілі.
block.jababarium-gammaReaper.name = Гамма-Жнець
block.jababarium-gammaReaper.description = Найвища форма облогової зброї. Запускає колосальну ракету із сингуляріуму, що завдає нищівної шкоди на величезній площі. Потребує величезної кількості енергії та аргонового охолодження.
block.jababarium-ore-adamantium.name = Адамантієва Руда
block.jababarium-ore-adamantium.description = Тверда руда, багата на адамантій. Юніти не можуть її видобувати, тому потрібен потужний бур.

item.jababarium-feronium.name = Фероніум
item.jababarium-feronium.description = Щільний червонуватий сплав, основа більшості споруд і вдосконалень у цьому моді. Дуже вибухонебезпечний.
item.jababarium-cryostal.name = Кріосталь
item.jababarium-cryostal.description = Холодна, сяюча кристалічна сталь зі слабкою радіоактивністю. Використовується у швидкій логістиці та багатьох просунутих спорудах.
item.jababarium-pulsarite.name = Пульсарит
item.jababarium-pulsarite.description = Нестабільний, сильно заряджений, радіоактивний та вибухонебезпечний кристал. Живить реактори та йде на просунуті споруди й юнітів.
item.jababarium-singularium.name = Сингуляріум
item.jababarium-singularium.description = Важка, заряджена та вкрай вибухонебезпечна речовина зі стисненої сингулярності. Використовується як боєприпас для наймогутніших турелей і для будівництва найпросунутіших споруд.
item.jababarium-chronite.name = Хроніт
item.jababarium-chronite.description = Важкий сірий метал, що викривлює час. Використовується як боєприпас для Хроноса та як інгредієнт просунутих матеріалів і споруд.
item.jababarium-sergium.name = Серджіум
item.jababarium-sergium.description = Темно-синій, надзвичайно радіоактивний та вибухонебезпечний метал. Спалюється в реакторах та використовується для виготовлення найпросунутіших матеріалів.
item.jababarium-amalgam.name = Амальгам
item.jababarium-amalgam.description = Золотистий сплав, спресований із рідкісних металів. Ключовий інгредієнт сингуляріуму та найбільших турелей і принтерів.
item.jababarium-adamantium.name = Адамантій
item.jababarium-adamantium.description = Надзвичайно твердий метал, який можна видобути лише потужними бурами. Використовується у швидкій логістиці, виробленні енергії та багатьох спорудах.

liquid.jababarium-nectron.name = Нектрон
liquid.jababarium-nectron.description = Густа, горюча та вибухонебезпечна зелена рідина. Не є охолоджувачем, але використовується у просунутому виробництві та вдосконаленнях.
liquid.jababarium-aerial.name = Ефір
liquid.jababarium-aerial.description = Легка рідина, що вільно тече, виготовлена з води. Ключовий інгредієнт просунутого виробництва та вдосконалень.
liquid.jababarium-mercury.name = Ртуть
liquid.jababarium-mercury.description = Важкий сріблястий рідкий метал, трохи горючий. Використовується для пресування амальгаму.
liquid.jababarium-argon.name = Аргон
liquid.jababarium-argon.description = Фіолетова рідина, що світиться й працює як охолоджувач. Охолоджує гігантські реактори та турелі й використовується для виробництва сингуляріуму.

status.jababarium-ionized-status.name = Іонізація
status.jababarium-ionized-status.description = Іонізовані юніти уповільнені, стріляють повільніше та отримують постійну шкоду з розрядами блискавок.
status.jababarium-chronos-stop.name = Хроностазис
status.jababarium-chronos-stop.description = Завмерли в часі. Юніт не може рухатися, стріляти чи будувати, доки ефект не зникне.
status.jababarium-intercepted.name = Перехоплено
status.jababarium-intercepted.description = Вибито з деформації. Юніт уповільнений, ослаблений та має знижену міцність.

unit.jababarium-scout.name = Скаут
unit.jababarium-scout.description = Швидкий легкоозброєний повітряний юніт для виснажливих атак і розвідки. Будується на Повітряному Конструкторі.
unit.jababarium-fray.name = Дірка
unit.jababarium-fray.description = Повітряний штурмовик, що стріляє швидкими лазерними болтами з крил.
unit.jababarium-zanuka.name = Занука
unit.jababarium-zanuka.description = Верткий легкий повітряний юніт, що засипає ворогів швидкими пострілами. Будується на Повітряному Конструкторі.
unit.jababarium-blip.name = Спалах
unit.jababarium-blip.description = Швидкий повітряний юніт, що вражає ворогів на близькій відстані блискавками.
unit.jababarium-geran.name = Герань
unit.jababarium-geran.description = Швидкий дрон-камікадзе. Пірнає на ціль і вибухає, пошкоджуючи все навколо.
unit.jababarium-omniq.name = Омнікс
unit.jababarium-omniq.description = Міцний повітряний юніт підтримки із захисним щитом і полем ремонту, що лікує союзників поруч.
unit.jababarium-vortex.name = Вортекс
unit.jababarium-vortex.description = Важкоброньований повітряний перехоплювач, що наближається до ворогів і стріляє серіями енергетичних куль.
unit.jababarium-spectre.name = Спектр
unit.jababarium-spectre.description = Важкий повітряний юніт, озброєний здвоєними лазерними гарматами.
unit.jababarium-destroyer.name = Знищувач
unit.jababarium-destroyer.description = Важкоброньований повітряний бойовий корабель із плазмовою гарматою, безперервним плазмовим променем і допоміжною скорострільною гарматою.
unit.jababarium-inferno.name = Інферно
unit.jababarium-inferno.description = Важкий повітряний юніт, що стріляє багряними снарядами та трійкою важких багряних списів, підтримуваний лазерною гарматою.
unit.jababarium-decimator.name = Дециматор
unit.jababarium-decimator.description = Величезний повітряний бойовий корабель, що стріляє плазмою порожнечі, керованими ракетами порожнечі та руйнівними вибухами порожнечі.
unit.jababarium-vindicator.name = Каратель
unit.jababarium-vindicator.description = Величезний повітряний бойовий корабель із багряними ланцюговими пострілами, безперервним багряним променем, серійними лазерами та багряними новими вибухами.
unit.jababarium-revenant.name = Ревенант
unit.jababarium-revenant.description = Гігантський повітряний флагман, озброєний морозною зброєю: вибухами абсолютного нуля, керованими ракетами, потоками та каскадами льоду й морозною рушницею.
unit.jababarium-oblivion.name = Облівіон
unit.jababarium-oblivion.description = Гігантський повітряний флагман, що вивільняє багряні вихори, інфернальні ядра, керовані списи та серійні лазери.
unit.jababarium-nemesis.name = Немезіс
unit.jababarium-nemesis.description = Найвищий повітряний флагман. Нищить ворогів арсеналом на тему природи: зеленими променями, мережами блискавок, руйнівними вибухами та обертовим хрестоподібним лазером, а його ударні хвилі відкидають ворогів.
unit.jababarium-tiny.name = Малюк
unit.jababarium-tiny.description = Невеликий ходячий юніт, що закидає ворогів снарядами. Будується на Наземному Конструкторі.
unit.jababarium-ariel.name = Аріель
unit.jababarium-ariel.description = Легкий ходячий юніт із компактною гарматою, міцніший за свого попередника.
unit.jababarium-widow.name = Вдова
unit.jababarium-widow.description = Міцний ходячий юніт, озброєний штурмовою гарматою, мініганом, залпами ракет та випромінювачем блискавок.
unit.jababarium-empress.name = Імператриця
unit.jababarium-empress.description = Масивний ходячий юніт, що стріляє пекучими лазерами, імпульсними хвилями та громовими пострілами.
unit.jababarium-theridion.name = Терідіон
unit.jababarium-theridion.description = Масивний ходячий юніт, що жбурляє у ворогів важкі згустки та дуги енергії.
unit.jababarium-octoclasm.name = Октоклазм
unit.jababarium-octoclasm.description = Величезна ходяча бойова машина, що стріляє серіями важких згустків та зарядженими гарматними пострілами.
unit.jababarium-oraxia.name = Ораксія
unit.jababarium-oraxia.description = Колосальна ходяча бойова машина зі смертельним променем, давніми енергетичними кулями та батареєю важких знарядь.
unit.jababarium-broodmother.name = Мама Павучат
unit.jababarium-broodmother.description = Наймогутніший ходячий юніт зі згубним смертельним променем, припливними енергетичними кулями, повторюваним лазером та артилерією наднової.
unit.jababarium-undertow.name = Андертоу
unit.jababarium-undertow.description = Легкий морський юніт зі скорострільною гарматою. Будується на Водному Конструкторі.
unit.jababarium-pelagis.name = Пелагіс
unit.jababarium-pelagis.description = Легкий морський юніт, озброєний палубною гарматою. Будується на Водному Конструкторі.
unit.jababarium-ripjaw.name = Розрив
unit.jababarium-ripjaw.description = Морський юніт, що запускає у ворогів ракети.
unit.jababarium-aquarail.name = Аквареіл
unit.jababarium-aquarail.description = Морський юніт, що запускає у ворогів ракети з міцнішого корпусу.
unit.jababarium-brinneclaw.name = Пазур
unit.jababarium-brinneclaw.description = Важкий морський юніт, що поєднує ракетні залпи з дугами блискавок.
unit.jababarium-vector.name = Вектор
unit.jababarium-vector.description = Важкий морський юніт, що поєднує ракетні залпи з дугами блискавок.
unit.jababarium-maelstromis.name = Мелстрой
unit.jababarium-maelstromis.description = Великий морський бойовий корабель, що стріляє серіями енергетичних куль за підтримки допоміжної гармати.
unit.jababarium-glacial.name = Гласіал
unit.jababarium-glacial.description = Великий морський бойовий корабель, озброєний серійними лазерами та важким багряним списом.
unit.jababarium-quantar.name = Квантар
unit.jababarium-quantar.description = Важкоброньований морський бойовий корабель, що стріляє квантовими згустками та іонними імпульсами.
unit.jababarium-rift.name = Розлом
unit.jababarium-rift.description = Морський бойовий корабель, що роздирає ворогів вибухами розлому та червоними блискавками.
unit.jababarium-leviathan.name = Левіафан
unit.jababarium-leviathan.description = Жахливий морський бойовий корабель із серіями квантових згустків, плазмових зарядів та гіперпроменем.
unit.jababarium-phantom.name = Фантом
unit.jababarium-phantom.description = Морський бойовий корабель, що вражає вибухами розлому та залпами червоних блискавок.
unit.jababarium-tidebreaker.name = Хвилеріз
unit.jababarium-tidebreaker.description = Могутній морський флагман, озброєний списами порожнечі, ракетними ударами, здвоєними лазерними гарматами, конденсованими згустками та блискавками.
unit.jababarium-ocelexis.name = Оцелексіс
unit.jababarium-ocelexis.description = Найвищий морський флагман. Вивільняє червоні блискавки, припливні лазери та енергетичні кулі, серії блискавок і руйнівні снаряди.

